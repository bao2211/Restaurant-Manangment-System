services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: rms-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: yB7Y%0Q137cMe%
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: 1024
    ports:
      - "1433:1433"
    volumes:
      - rms_sqlData:/var/opt/mssql
    networks:
      - rms-network
    labels:
      UFW_MANAGED: 'TRUE'
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'yB7Y%0Q137cMe%' -Q 'SELECT 1' -C || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  rms-api:
    image: bao2211/rms-apiserver:latest
    container_name: rms-api-server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_RUNNING_IN_CONTAINER=true
      - CORS_ORIGINS=*
      - ConnectionStrings__DefaultConnection=Server=db;Database=webQLQuanAn;User Id=sa;Password=yB7Y%0Q137cMe%;Encrypt=True;TrustServerCertificate=True;
    restart: unless-stopped
    networks:
      - rms-network
    labels:
      UFW_MANAGED: 'TRUE'

volumes:
  rms_sqlData:
    external: true
  mysql-data:

networks:
  rms-network:
    driver: bridge